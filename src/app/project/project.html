@if (project) {
<article>
    <header class="pt-32 pb-10 max-w-4xl mx-auto px-6">

        <!-- Back link -->
        <a routerLink="/work"
            class="inline-flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400 hover:text-accent transition-colors mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18" />
            </svg>
            Back to projects
        </a>

        <!-- Tags + date -->
        <div class="flex flex-wrap items-center gap-3 mb-6">
            <span
                class="text-xs px-2.5 py-1 rounded-full bg-orange-50 dark:bg-zinc-800 text-accent border border-orange-200 dark:border-zinc-700">
                {{ project.category }}
            </span>
            @for (tag of project.tags; track tag) {
            <span
                class="text-xs px-2.5 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">
                {{ tag }}
            </span>
            }
        </div>
        <h1
            class="reveal font-display font-bold text-4xl md:text-5xl lg:text-6xl text-zinc-900 dark:text-white leading-tight mb-6">
            {{ project.title }}
        </h1>

        <p class="reveal d1 text-xl text-zinc-500 dark:text-zinc-400 leading-relaxed mb-10 max-w-2xl">
            {{ project.desc }}
        </p>

        <!-- Action Links -->
        <div
            class="reveal justify-around d2 flex flex-wrap gap-4 py-8 border-t border-b border-zinc-100 dark:border-zinc-900">

            <a [href]="project.repoUrl" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center gap-2 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-medium px-6 py-3 rounded-full hover:bg-zinc-700 dark:hover:bg-zinc-200 transition-colors text-sm">
                Source Code
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                </svg>
            </a>
            @if (project.demoUrl) {
            <a [href]="project.demoUrl" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center gap-2 bg-accent text-white font-medium px-6 py-3 rounded-full hover:bg-accent-light transition-colors text-sm">
                View Live Demo
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </a>
            } @else {
            <a class="inline-flex items-center gap-2 bg-zinc-200 dark:bg-zinc-800 text-zinc-400 dark:text-zinc-600 font-medium px-6 py-3 rounded-full cursor-not-allowed text-sm"
                aria-disabled="true">
                View Live Demo (Unavailable)
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </a>
            }



        </div>
    </header>

    <!-- ═══ HERO IMAGE ═══ -->
    <div class="max-w-6xl mx-auto px-6 mb-16">
        <div class="reveal photo-frame w-full h-72 md:h-[480px] rounded-3xl">
            <img [src]="project.img" [alt]="project.title" loading="eager" />
        </div>
    </div>

    @if (safeContent) {
    <div class="max-w-3xl mx-auto px-6 pb-4 prose-cs" [innerHTML]="safeContent"></div>
    }
</article>
}
